<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AQUA localStorage backup</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, sans-serif;
        background: #f5f7fb;
        color: #172033;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }

      main {
        width: min(92vw, 560px);
        padding: 32px;
        background: white;
        border: 1px solid #dfe5ef;
        border-radius: 12px;
        box-shadow: 0 12px 32px rgb(23 32 51 / 10%);
      }

      h1 {
        margin-top: 0;
        font-size: 1.5rem;
      }

      p {
        line-height: 1.5;
      }

      button {
        cursor: pointer;
        border: 0;
        border-radius: 8px;
        padding: 12px 16px;
        background: #1769e0;
        color: white;
        font: inherit;
        font-weight: 700;
      }

      button:disabled {
        cursor: wait;
        opacity: 0.7;
      }

      #status {
        min-height: 1.5em;
        margin-bottom: 0;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>AQUA localStorage backup</h1>
      <p>Cong cu nay chi doc localStorage cua origin hien tai va tai file JSON ve may.</p>
      <p>Khong ket noi Firebase, khong gui du lieu len server, khong sua hoac xoa localStorage.</p>
      <button id="export-button" type="button">Export backup JSON</button>
      <p id="status" role="status" aria-live="polite"></p>
    </main>

    <script>
      const collectionKeys = [
        'aqua:projects',
        'aqua:tasks',
        'aqua:attendance',
        'aqua:departments',
        'aqua:events',
        'aqua:positions',
        'aqua:conversations',
        'aqua:messages',
        'aqua:notifications',
      ]

      const optionalKeys = ['aqua:theme', 'aqua:sidebar-collapsed']
      const button = document.querySelector('#export-button')
      const status = document.querySelector('#status')

      function readJson(key, missingValue) {
        const raw = window.localStorage.getItem(key)
        if (raw === null) return missingValue

        try {
          return JSON.parse(raw)
        } catch {
          return null
        }
      }

      function downloadBackup() {
        button.disabled = true
        status.textContent = 'Dang tao file backup...'

        try {
          const data = {}
          collectionKeys.forEach((key) => {
            data[key] = readJson(key, [])
          })
          optionalKeys.forEach((key) => {
            data[key] = readJson(key, null)
          })

          const backup = {
            exportedAt: new Date().toISOString(),
            source: 'AQUA localStorage backup',
            data,
          }
          const json = JSON.stringify(backup, null, 2)
          const blob = new Blob([json], { type: 'application/json' })
          const url = URL.createObjectURL(blob)
          const link = document.createElement('a')
          const stamp = backup.exportedAt.replace(/[:.]/g, '-')

          link.href = url
          link.download = `aqua-localstorage-backup-${stamp}.json`
          document.body.appendChild(link)
          link.click()
          link.remove()
          URL.revokeObjectURL(url)

          status.textContent = `Da tao backup gom ${collectionKeys.length} key du lieu va ${optionalKeys.length} key tuy chon.`
        } catch (error) {
          status.textContent = `Khong the export: ${error.message}`
        } finally {
          button.disabled = false
        }
      }

      button.addEventListener('click', downloadBackup)
    </script>
  </body>
</html>
